<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Label QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
       body {
           font-family: Arial, sans-serif;
           background-color: #f5f5f5;
           min-height: 100vh;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
       }
       .input-section {
           background: white;
           padding: 24px 32px;
           border-radius: 12px;
           box-shadow: 0 2px 8px rgba(0,0,0,0.12);
           max-width: 700px;
           margin: 32px auto 0 auto;
           display: flex;
           flex-direction: column;
           align-items: center;
       }
       .form-horizontal {
           display: flex;
           flex-wrap: wrap;
           gap: 24px;
           justify-content: center;
           align-items: center;
           margin-bottom: 18px;
       }
       .form-group {
           display: flex;
           flex-direction: column;
           min-width: 220px;
       }
       .form-group label {
           margin-bottom: 5px;
           font-weight: bold;
       }
       .form-group input, .form-group select {
           width: 100%;
           padding: 8px;
           border: 1px solid #ddd;
           border-radius: 4px;
       }
       .buttons {
           display: flex;
           gap: 12px;
           margin-bottom: 8px;
       }
       button {
           background-color: #007bff;
           color: white;
           padding: 10px 22px;
           border: none;
           border-radius: 4px;
           cursor: pointer;
           font-size: 16px;
       }
       button:hover {
           background-color: #0056b3;
       }
       .app-version {
           margin-top: 10px;
           font-size: 13px;
           color: #888;
           text-align: center;
           letter-spacing: 1px;
       }
       .print-area {
           width: 210mm;
           height: 297mm;
           background: white;
           margin: 20px auto;
           box-shadow: 0 0 10px rgba(0,0,0,0.1);
       }
       .label {
           width: 210mm;
           height: 99mm;
           border-bottom: 1px dashed #ccc;
           padding: 6mm 10mm 10mm 10mm; /* reduced top padding to decrease space above label id */
           display: flex;
           flex-direction: column;
           justify-content: space-between;
       }
       .label:last-child {
           border-bottom: none;
       }
       .label-header {
           text-align: center;
           margin-bottom: 5mm;
       }
       .label-id {
           font-size: 28px;
           font-weight: bold;
           letter-spacing: 2px;
       }
       .main-row {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin: 0 10mm;
         margin-bottom: 5mm;
      }
      .qr-container {
         width: 35mm;
         height: 35mm;
         display: flex;
         align-items: center;
         justify-content: center;
         background: white;
         flex: 0 0 35mm;
      }
      .qr-container img {
         width: 30mm;
         height: 30mm;
      }
      .center-info {
         flex: 1;
         display: flex;
         flex-direction: column;
      }
       .info-line {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 3mm;
       }
       .info-label {
           flex: 1;
           text-align: right;
           font-weight: bold;
           font-size: 14px;
       }
       .info-colon {
           flex: 0 0 5mm;
           text-align: center;
           font-weight: normal;
           font-size: 14px;
       }
       .info-value {
           flex: 1;
           text-align: left;
           font-weight: normal;
           font-size: 14px;
       }
       .jumlah-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            margin-bottom: 2mm;
        }
        .jumlah-label {
            flex: 1;
            text-align: right;
            font-weight: bold;
            font-size: 15px;
        }
        .jumlah-colon {
            flex: 0 0 5mm;
            text-align: center;
            font-weight: normal;
            font-size: 15px;
        }
        .jumlah-value {
            flex: 1;
            text-align: left;
            font-weight: normal;
            font-size: 15px;
        }
       .bottom-row {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin: 0 10mm;
           margin-bottom: 5mm;
           font-size: 14px;
           white-space: nowrap;
       }
       .bottom-item {
           flex: 1;
           display: flex;
           justify-content: center;
           align-items: center;
       }
       .bottom-item .info-label {
           font-weight: bold;
           margin-right: 3mm;
       }
       .bottom-item .info-value {
           font-weight: normal;
       }
       .footer-row {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin: 0 10mm;
           font-size: 14px;
           padding-top: 1mm; /* reduced from 3mm to make label spacing tighter above checkboxes */
       }
       .checkbox-item {
           flex: 1;
           display: flex;
           justify-content: center;
           align-items: center;
       }
       .checkbox {
           width: 6mm;
           height: 6mm;
           border: 2px solid #000;
           margin-right: 2mm;
           background: white;
       }
       .checkbox-label {
           font-weight: bold;
           font-size: 14px;
       }
       @media print {
           body {
               background: white;
               margin: 0;
           }
           .input-section {
               display: none;
           }
           .print-area {
               margin: 0;
               box-shadow: none;
           }
           .label {
               border-bottom: 1px solid #000;
               page-break-inside: avoid;
           }
           .label:last-child {
               border-bottom: none;
           }
       }
       @page {
           size: A4;
           margin: 0;
       }
</style>

</head>
<body>
<div class="input-section">
<h2 style="margin-bottom: 16px;">Generator Label QR Code</h2>
<form class="form-horizontal" onsubmit="event.preventDefault(); generateLabels();">
    <div class="form-group">
        <label for="labelId">Label ID:</label>
        <input type="text" id="labelId" placeholder="Contoh: 25-TVLB-REC---CBL---000001">
    </div>
    <div class="form-group">
        <label for="kodeReclass">Kode Reclass:</label>
        <select id="kodeReclass">
            <option value="-">-</option>
            <option value="MS">MS</option>
        </select>
    </div>
    <div class="form-group">
        <label for="jenis">Jenis:</label>
        <select id="jenis">
            <option value="Incoming" selected>Incoming</option>
            <option value="Gudang">Gudang</option>
            <option value="Evaluasi">Evaluasi</option>
            <option value="Mapping">Mapping</option>
        </select>
    </div>
    <div class="form-group">
        <label for="jumlah">Jumlah:</label>
        <input type="number" min="1" id="jumlah" placeholder="Masukkan jumlah (misal: 100)">
    </div>
    <div class="form-group">
        <label for="tanggal">Tanggal Beli:</label>
        <input type="date" id="tanggal" placeholder="DD-MM-YYYY">
    </div>
</form>
<div class="buttons">
    <button onclick="generateLabels()">Generate Label</button>
    <button onclick="printLabels()">Print</button>
    <button onclick="downloadPDF()">Download PDF</button>
</div>
<div class="app-version">
    Versi App: 2.0.1
</div>
</div>
<div class="print-area" id="printArea">
<!-- Labels will be generated here -->
</div>
<script>
function parseLabel(labelId) {
   const mainParts = labelId.split('---');
   if (mainParts.length !== 3) throw new Error('Invalid Label ID format');
   const firstParts = mainParts[0].split('-');
   return {
       tahun: firstParts[0] || '',
       origin: firstParts[1] || '',
       kode: firstParts[2] || '',
       grade: mainParts[1] || '',
       runningNumber: mainParts[2] || ''
   };
}
function generateQRUrl(text) {
   return `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(text)}&size=120x120`;
}
function getQueryParams() {
   const params = new URLSearchParams(window.location.search);
   return {
       labelId: params.get('labelId') || '',
       kodeReclass: params.get('kodeReclass') || '-',
       jenis: params.get('jenis') || '',
       jumlah: params.get('jumlah') || '',
       tanggal: params.get('tanggal') || ''
   };
}
function formatDateDisplay(input) {
    if (!input) return '';
    // YYYY-MM-DD -> DD-MM-YYYY
    if (/^\d{4}-\d{2}-\d{2}$/.test(input)) {
        const [y,m,d] = input.split('-');
        return `${d}-${m}-${y}`;
    }
    // DD-MM-YYYY -> keep
    if (/^\d{2}-\d{2}-\d{4}$/.test(input)) return input;
    // try Date parse
    const dt = new Date(input);
    if (!isNaN(dt)) {
        const d = ('0' + dt.getDate()).slice(-2);
        const m = ('0' + (dt.getMonth() + 1)).slice(-2);
        const y = dt.getFullYear();
        return `${d}-${m}-${y}`;
    }
    return input;
}
function normalizeDateForInput(dateStr) {
    if (!dateStr) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
    if (/^\d{2}-\d{2}-\d{4}$/.test(dateStr)) {
        const [d,m,y] = dateStr.split('-');
        return `${y}-${m}-${d}`;
    }
    const dt = new Date(dateStr);
    if (!isNaN(dt)) {
        const y = dt.getFullYear();
        const m = ('0' + (dt.getMonth() + 1)).slice(-2);
        const d = ('0' + dt.getDate()).slice(-2);
        return `${y}-${m}-${d}`;
    }
    return '';
}
function setInitialFormValues() {
    const params = getQueryParams();
    if (params.labelId) document.getElementById('labelId').value = params.labelId;
    if (params.kodeReclass) document.getElementById('kodeReclass').value = params.kodeReclass;
    if (params.jenis) document.getElementById('jenis').value = params.jenis;
    if (params.jumlah) document.getElementById('jumlah').value = params.jumlah;
    if (params.tanggal) document.getElementById('tanggal').value = normalizeDateForInput(params.tanggal);
    // ensure kodeReclass follows jenis logic on init
    updateKodeReclass();
}

// otomatis set kodeReclass berdasarkan nilai jenis
function updateKodeReclass() {
    const jenis = document.getElementById('jenis').value;
    const kodeSelect = document.getElementById('kodeReclass');
    if (jenis === 'Mapping' || jenis === 'Evaluasi') {
        kodeSelect.value = 'MS';
    } else {
        kodeSelect.value = '-';
    }
}

// listen for perubahan jenis
document.addEventListener('DOMContentLoaded', function() {
    const jenisEl = document.getElementById('jenis');
    if (jenisEl) jenisEl.addEventListener('change', updateKodeReclass);
});

function generateLabels() {
   const params = getQueryParams();
   const labelIdInput = document.getElementById('labelId').value.trim();
   // read jenis and jumlah/tanggal from DOM
   const jenisInput = document.getElementById('jenis').value;
   const jumlahInput = document.getElementById('jumlah').value;
   const tanggalInput = document.getElementById('tanggal').value; // YYYY-MM-DD from input type=date

   // Pilih sumber value jenis:
   let jenis = jenisInput || params.jenis || "Contoh";
   // Jika user belum memilih apapun (jenisInput kosong), baru fallback ke param atau default
   let jumlah = jumlahInput || params.jumlah || "";

   const labelId = labelIdInput || params.labelId;

   // otomatiskan kodeReclass berdasarkan jenis (Mapping/Evaluasi => MS, selainnya => '-')
   let kodeReclass = '-';
   if (jenis === 'Mapping' || jenis === 'Evaluasi') kodeReclass = 'MS';

   // tanggal: prefer input value (YYYY-MM-DD), fallback to params.tanggal (could be DD-MM-YYYY or YYYY-MM-DD)
   let tanggal = '';
   if (tanggalInput) {
       tanggal = tanggalInput; // keep as YYYY-MM-DD for formatting later
   } else if (params.tanggal) {
       // try to normalize param to YYYY-MM-DD for consistent formatting
       const normalized = normalizeDateForInput(params.tanggal);
       tanggal = normalized || params.tanggal;
   }

   if (!labelId) {
       alert('Mohon masukkan Label ID');
       return;
   }
   try {
       const parsedLabel = parseLabel(labelId);
       const printArea = document.getElementById('printArea');
       const qrUrl = generateQRUrl(labelId);

       // Sinkronisasi field agar tetap sesuai isi form
       document.getElementById('labelId').value = labelId;
       document.getElementById('kodeReclass').value = kodeReclass;
       document.getElementById('jenis').value = jenis;
       document.getElementById('jumlah').value = jumlah;
       // set tanggal input (normalize to YYYY-MM-DD) so the date picker shows value if possible
       document.getElementById('tanggal').value = normalizeDateForInput(tanggal);

       let html = '';
       for (let i = 0; i < 3; i++) {
           html += `
<div class="label">
<div class="label-header">
<div class="label-id">${labelId}</div>
<div style="font-size:25px; font-weight:bold; margin-top:2mm;">[ ${jenis} ]</div>
</div>
<div class="main-row">
<div class="qr-container">
<img src="${qrUrl}" alt="QR Code">
</div>
<div class="center-info">
<div class="info-line">
<span class="info-label">TAHUN</span>
<span class="info-colon">:</span>
<span class="info-value">${parsedLabel.tahun}</span>
</div>
<div class="info-line">
<span class="info-label">TGL_BELI</span>
<span class="info-colon">:</span>
<span class="info-value">${formatDateDisplay(tanggal) || '-'}</span>
</div>
<div class="info-line">
<span class="info-label">ORIGIN</span>
<span class="info-colon">:</span>
<span class="info-value">${parsedLabel.origin}</span>
</div>
<div class="info-line">
<span class="info-label">KODE</span>
<span class="info-colon">:</span>
<span class="info-value">${parsedLabel.kode}</span>
</div>
<div class="info-line">
<span class="info-label">RUNNING NUMBER</span>
<span class="info-colon">:</span>
<span class="info-value">${parsedLabel.runningNumber}</span>
</div>
<div class="jumlah-line">
<span class="jumlah-label">JUMLAH</span>
<span class="jumlah-colon">:</span>
<span class="jumlah-value">${jumlah || '-'}</span>
</div>
</div>
<div class="qr-container">
<img src="${qrUrl}" alt="QR Code">
</div>
</div>
<div class="bottom-row">
<div class="bottom-item">
<span class="info-label">TRADER :</span>
<span class="info-value">-</span>
</div>
<div class="bottom-item">
<span class="info-label">GRADE :</span>
<span class="info-value">${parsedLabel.grade}</span>
</div>
<div class="bottom-item">
<span class="info-label">KODE RECLASS :</span>
<span class="info-value">${kodeReclass}</span>
</div>
</div>
<div class="footer-row">
<div class="checkbox-item">
<div class="checkbox"></div>
<span class="checkbox-label">APPSHEET</span>
</div>
<div class="checkbox-item">
<div class="checkbox"></div>
<span class="checkbox-label">SPG</span>
</div>
<div class="checkbox-item">
<div class="checkbox"></div>
<span class="checkbox-label">CHECK</span>
</div>
</div>
</div>
           `;
       }
       printArea.innerHTML = html;
       if (params.labelId) {
           setTimeout(() => {
               window.print();
           }, 1000);
       }
   } catch (error) {
       alert('Format Label ID tidak valid. Gunakan format seperti: 25-TVLB-REC---CDKL---000001');
   }
}
function printLabels() {
   const printArea = document.getElementById('printArea');
   if (!printArea.innerHTML.trim()) {
       alert('Mohon generate label terlebih dahulu');
       return;
   }
   window.print();
}
function downloadPDF() {
   const printArea = document.getElementById('printArea');
   if (!printArea.innerHTML.trim()) {
       alert('Mohon generate label terlebih dahulu');
       return;
   }
   const opt = {
       margin: 0,
       filename: 'qr-labels.pdf',
       image: { type: 'jpeg', quality: 1.0 },
       html2canvas: {
           scale: 2,
           useCORS: true,
           backgroundColor: '#ffffff'
       },
       jsPDF: {
           unit: 'mm',
           format: 'a4',
           orientation: 'portrait'
       }
   };
   html2pdf().set(opt).from(printArea).save();
}
// Saat halaman load, set form value dari param URL jika ada
window.addEventListener('load', function() {
   setInitialFormValues();
   generateLabels();
});
</script>
</body>
</html>
